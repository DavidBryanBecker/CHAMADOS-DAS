<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<div class="container mt-5 text-center" style="max-width: 600px;">
    <h1 class="display-4" th:text="${status}">Erro</h1>
    <h2 class="h4 mb-3">Algo deu errado</h2>
    <p class="text-muted">Não foi possível concluir a operação. Tente novamente.</p>
    <a th:href="@{/app}" class="btn btn-primary">Voltar ao dashboard</a>
</div>
</body>
</html>
