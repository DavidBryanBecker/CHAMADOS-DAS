<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Categorias</h1>
        <a th:href="@{/app/categorias/novo}" class="btn btn-primary">Nova categoria</a>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr><th>ID</th><th>Nome</th><th>Descrição</th></tr>
        </thead>
        <tbody>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nome}"></td>
                <td th:text="${c.descricao}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="3" class="text-center text-muted">Nenhuma categoria cadastrada</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
