<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Técnicos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Técnicos</h1>
        <a th:href="@{/app/tecnicos/novo}" class="btn btn-primary">Novo técnico</a>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Perfil</th></tr>
        </thead>
        <tbody>
            <tr th:each="t : ${tecnicos}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.nome}"></td>
                <td th:text="${t.email}"></td>
                <td th:text="${t.perfil}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(tecnicos)}">
                <td colspan="4" class="text-center text-muted">Nenhum técnico cadastrado</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
