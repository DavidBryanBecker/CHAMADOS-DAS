<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Novo técnico')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<div class="container mt-4" style="max-width: 600px;">
    <h1 class="h3 mb-3">Novo técnico</h1>

    <form th:action="@{/app/tecnicos}" th:object="${tecnicoForm}" method="post" novalidate>
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" id="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label for="perfil" class="form-label">Perfil</label>
            <select id="perfil" th:field="*{perfil}" class="form-select"
                    th:classappend="${#fields.hasErrors('perfil')} ? 'is-invalid'">
                <option value="">Selecione...</option>
                <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{perfil}"></div>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a th:href="@{/app/tecnicos}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
