<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>

<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Clientes</h1>
        <a class="btn btn-primary" th:href="@{/app/clientes/novo}">Novo cliente</a>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>

    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.id}">1</td>
            <td th:text="${c.nome}">Nome</td>
            <td th:text="${c.email}">email@exemplo.com</td>
            <td th:text="${c.telefone}">47999999999</td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="4" class="text-center text-muted">Nenhum cliente cadastrado.</td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
