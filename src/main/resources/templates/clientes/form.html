<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Novo cliente')}"></head>
<body>

<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container my-4" style="max-width: 600px;">
    <h1 class="h3 mb-4">Novo cliente</h1>

    <form th:action="@{/app/clientes}" th:object="${clienteForm}" method="post" novalidate>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control" th:field="*{nome}"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" id="email" class="form-control" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" id="telefone" class="form-control" th:field="*{telefone}"
                   th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{telefone}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a class="btn btn-secondary" th:href="@{/app/clientes}">Cancelar</a>
    </form>
</main>

</body>
</html>
